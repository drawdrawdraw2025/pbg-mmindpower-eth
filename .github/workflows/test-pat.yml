name: Test PAT
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "GH_PAT length is ${#GH_PAT}"
          if [ ${#GH_PAT} -lt 10 ]; then echo "GH_PAT TOO SHORT - secret broken!"; exit 1; else echo "GH_PAT OK"; fi
          # Try to list GH_PAT first 4 chars safely
          echo "GH_PAT starts with ${GH_PAT:0:4}"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
