name: Deploy to Filebase IPFS

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3,15 * * *'   # 08:30 & 20:30 IST - dual daily pin+warm (was hourly+6h => ~70% of free minutes burned)
    - cron: '0 3 * * 1'      # Monday 08:30 IST - weekly QR/ENS refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 💓 GH_PAT alive check
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          C=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GH_PAT" https://api.github.com/user)
          if [ "$C" != "200" ]; then echo "::error::GH_PAT expired/invalid — renew: repo Settings → Secrets → GH_PAT"; exit 1; fi
          echo "GH_PAT alive ✓"

      - name: Upload to Filebase IPFS
        uses: aquiladev/ipfs-action@v0.3.1
        id: ipfs
        with:
          path: ./
          service: filebase
          filebaseBucket: pbg-mmindpower-eth
          filebaseKey: ${{ secrets.FILEBASE_KEY }}
          filebaseSecret: ${{ secrets.FILEBASE_SECRET }}
          pin: true

      - name: Show IPFS Link
        run: |
          echo "Deployed to IPFS!"
          echo "CID: ${{ steps.ipfs.outputs.cid }}"
          echo "Gateway: https://ipfs.filebase.io/ipfs/${{ steps.ipfs.outputs.cid }}"
          echo "Crust: https://crustwebsites.net/ipfs/${{ steps.ipfs.outputs.cid }}"

      - name: Warm Crust Gateway
        if: success()
        run: |
          CID="${{ steps.ipfs.outputs.cid }}"
          echo "Warming Crust gateway for CID $CID"
          curl -m 10 -I "https://crustwebsites.net/ipfs/$CID" || echo "Crust warming (may 523 first time)"
          curl -m 10 -I "https://ipfs.crustapps.net/ipfs/$CID" || true
          curl -m 10 -I "https://ipfs.filebase.io/ipfs/$CID" || true
          curl -m 10 -I "https://bafybeihdw6la2uczahihdmg4hxyxliciakvzig56rojdehkywdiuqsnfuq.ipfs.inbrowser.link/" || true

      - name: Update Permanent Gateway
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:${GH_PAT}@github.com/drawdrawdraw2025/pbg-permanent.git /tmp/pbg-permanent
          cd /tmp/pbg-permanent
          cat > latest.json << EOF
          {
            "cid": "${{ steps.ipfs.outputs.cid }}",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "bucket": "pbg-mmindpower-eth",
            "gateway": "https://ipfs.filebase.io/ipfs/${{ steps.ipfs.outputs.cid }}",
            "source_repo": "drawdrawdraw2025/pbg-mmindpower-eth",
            "commit": "${{ github.sha }}"
          }
          EOF
          cat latest.json
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add latest.json
          git commit -m "Update to CID ${{ steps.ipfs.outputs.cid }} from ${{ github.sha }}" || echo "No changes"
          git push origin main
