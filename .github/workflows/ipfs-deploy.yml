name: Deploy to Filebase IPFS

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug GH_PAT
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then echo "GH_PAT is EMPTY - secret not set!"; else echo "GH_PAT is SET, length check"; echo "${{ secrets.GH_PAT }}" | wc -c; fi
          if [ -z "${{ secrets.FILEBASE_KEY }}" ]; then echo "FILEBASE_KEY empty"; else echo "FILEBASE_KEY set"; fi
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Upload to Filebase IPFS
        uses: aquiladev/ipfs-action@v0.3.1
        id: ipfs
        with:
          path: ./
          service: filebase
          filebaseBucket: pbg-mmindpower-eth
          filebaseKey: ${{ secrets.FILEBASE_KEY }}
          filebaseSecret: ${{ secrets.FILEBASE_SECRET }}
          pin: true

      - name: Show IPFS Link
        run: |
          echo "Deployed to IPFS!"
          echo "CID: ${{ steps.ipfs.outputs.cid }}"
          echo "Gateway: https://ipfs.filebase.io/ipfs/${{ steps.ipfs.outputs.cid }}"

      - name: Update Permanent Gateway
        if: success()
        run: |
          echo "Updating permanent QR gateway with new CID: ${{ steps.ipfs.outputs.cid }}"
          # Use GH_PAT via env to avoid masking issues, and push via API
          echo "GH_PAT length via env: ${#GH_PAT}"
          git clone https://oauth2:${GH_PAT}@github.com/drawdrawdraw2025/pbg-permanent.git /tmp/pbg-permanent 2>&1 | head -n 5
          cd /tmp/pbg-permanent
          cat > latest.json << EOF
          {
            "cid": "${{ steps.ipfs.outputs.cid }}",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "bucket": "pbg-mmindpower-eth",
            "gateway": "https://ipfs.filebase.io/ipfs/${{ steps.ipfs.outputs.cid }}",
            "source_repo": "drawdrawdraw2025/pbg-mmindpwer-free",
            "commit": "${{ github.sha }}"
          }
          EOF
          cat latest.json
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add latest.json
          git commit -m "Update to CID ${{ steps.ipfs.outputs.cid }} from ${{ github.sha }}" || echo "No changes"
          git push https://oauth2:${GH_PAT}@github.com/drawdrawdraw2025/pbg-permanent.git main 2>&1 | head -n 20
          echo "push exit code $?"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
